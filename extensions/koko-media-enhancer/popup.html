<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Koko Media Enhancer</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d1a;
      color: #f3f4f6;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .tag {
      font-size: 9px;
      font-family: monospace;
      padding: 2px 6px;
      background: #2563eb;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .feature {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151; transition: .3s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Koko Media Enhancer</span>
    <span class="tag">Active</span>
  </div>
  <div class="desc">
    Enables client-side canvas watermark removal and clean high-resolution export for Gemini images & videos on Koko AI.
  </div>
  <div class="feature">
    <span>Watermark Removal</span>
    <label class="switch">
      <input type="checkbox" id="toggleClean" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="feature">
    <span>Lossless PNG Export</span>
    <label class="switch">
      <input type="checkbox" id="togglePng" checked>
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
